# Dependabot keeps dependencies and GitHub Actions patched, which is the
# bulk of real-world supply-chain risk. Security updates are raised
# automatically; the schedules below cover routine version bumps.
version: 2
updates:
  # Application dependencies (npm/pnpm).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    groups:
      # Batch low-risk dev/minor/patch bumps into one PR to cut noise.
      dev-and-minor:
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"

  # GitHub Actions used by the workflows (pin/version hygiene).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    labels:
      - "dependencies"
      - "ci"

  # Docker base images.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    labels:
      - "dependencies"
      - "docker"
