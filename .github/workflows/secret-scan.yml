name: Secret Scan

# Server-side secret scanning with Gitleaks. Complements the local
# pre-commit hook (.githooks/pre-commit) and CodeQL (codeql.yml):
# the hook is best-effort and bypassable, this gate is not.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full-history scan (Mondays 05:23 UTC), randomised minute.
    - cron: "23 5 * * 1"

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so PR/push scans cover every introduced commit,
          # not just the tip.
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
