# Gitleaks configuration for OpenPlaud.
# Used by both the CI workflow (.github/workflows/secret-scan.yml) and the
# local pre-commit hook (.githooks/pre-commit) when gitleaks is installed.
#
# Start from the maintained default ruleset, then add project-specific
# allowlists for the KNOWN dummy/placeholder values that legitimately live
# in the repo (env templates and CI build-time fakes). Never allowlist a
# real secret here — rotate it instead.

title = "OpenPlaud Gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Project-wide allowlist for documented placeholders"

# Files that are templates/fixtures by design.
paths = [
  '''\.env\.example$''',
  '''\.gitleaks\.toml$''',
]

# Specific placeholder strings that appear in templates and CI. These are
# intentionally fake and must stay matchable so scans never block on them.
regexes = [
  '''dummy-secret-for-build-only-not-used-in-production''',
  '''your-secret-key-here-generate-with-openssl-rand-hex-32''',
  '''your-64-char-hex-encryption-key-here''',
  # All-zero 64-char hex key used only for CI builds.
  '''0{64}''',
  # Obvious local/dummy postgres DSNs used in templates and CI.
  '''postgres(ql)?://(user:password|postgres:postgres)@localhost''',
]
